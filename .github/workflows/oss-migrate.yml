# 跨账号、跨地域 阿里云 OSS 桶迁移(CDN 预签名下载版)
#
# 原理:源桶 remote 配置 download_host 后,rclone 对对象读操作(GET 与
# HeadObject)生成 SigV4 预签名 URL(签名锚定 endpoint,即桶名.endpoint
# 的自定义域名),仅把 URL host 替换为 CDN 域名后发出;Cloudflare Worker
# 按原 host 回源,OSS 验签通过。列表/上传仍走签名 endpoint,与生产下载
# 链路同构。
# 需要定制版 rclone(含 download_host 选项),由公开库 yukaidi1220/rclone
# 的 CI 构建并发布 release,此处直接拉取 latest。
#
# 凭据管理(本工作流在公开仓库运行,故凭据绝不经由 inputs 传入):
#   入口在私有仓 rclone-action 的 "OSS Migrate launcher" 工作流:
#   在那里填入新旧桶与 CDN 信息 → 自动生成/提交 oss-migrate.conf 到私有仓
#   → 再由它触发本工作流。本工作流运行时用已有的 secrets.RCLONE_PAT
#   通过 GitHub API 拉取 oss-migrate.conf——凭据不进任何 run 历史,
#   不新建 secret,公开库无 Actions 时长上限。
#
# 用法(正常情况下不需要直接触发本工作流,去私有仓的 launcher 触发):
#   mode:
#     dry-run  连通性自检 + 模拟复制,不写任何数据(首次必跑)
#     copy     正式迁移,结束后自动执行校验
#     verify   只做校验(copy 因超时中断后可单独补跑)
#     cleanup  清理目标桶残留的分片上传(job 被强杀后的孤儿分片)
#   path: 留空 = 整个桶;填子路径如 "logs/2024" 则只迁移该前缀
#   (可用于先小规模试跑)。
#
# 断点续传:GitHub 单 job 上限 6 小时(本工作流设 350 分钟)。数据量大时
# copy 会被截断:rclone 会跳过已完成的文件,重新触发即续传,循环直到一轮
# 完整跑完;再跑一次 copy 让校验 PASSED 即为终态。

name: OSS Migrate (cross-account CDN)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        required: true
        default: "dry-run"
        options:
          - dry-run
          - copy
          - sync
          - verify
          - cleanup
      path:
        description: "迁移路径前缀(留空=整桶,如 logs/2024)"
        required: false
        default: ""

concurrency:
  group: oss-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RCLONE_CONFIG: /tmp/oss-migrate.conf
    steps:
      - name: Fetch oss-migrate.conf from private repo
        env:
          RCLONE_PAT: ${{ secrets.RCLONE_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          umask 077
          for i in {1..3}; do
            if curl -fsSL --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 5 \
              -H "Authorization: token $RCLONE_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/oss-migrate.conf" \
              -o "$RCLONE_CONFIG"; then
              echo "配置获取成功"
              break
            fi
            echo "获取失败,重试 $i/3..."
            sleep $((i * 5))
          done
          [ -f "$RCLONE_CONFIG" ] || { echo "::error::无法获取 oss-migrate.conf,请检查 RCLONE_PAT 权限或私有仓中是否存在该文件"; exit 1; }

      - name: Parse config & set paths
        env:
          PATH_PREFIX: ${{ inputs.path }}
        run: |
          # 从配置读取桶名与 RC4 加密名,拼出远端路径(src:/dst:)。
          # 桶内对象 key 自带加密桶名前缀(Worker 回源不剥首段),因此
          # 用 path 前缀做映射:src 读 afa0baf1/X,写入 dst 变为 afa0baf6/X。
          # 注意:s3 后端没有 root 配置项,conf 里的 root 会被忽略,绝不能
          # 依赖它做前缀注入(曾因此把源前缀原样复制进目标桶)。
          SRC_BUCKET=$(awk -F' *= *' '/^\[src\]/{f=1;next} /^\[/{f=0} f&&$1=="bucket"{print $2}' "$RCLONE_CONFIG")
          DST_BUCKET=$(awk -F' *= *' '/^\[dst\]/{f=1;next} /^\[/{f=0} f&&$1=="bucket"{print $2}' "$RCLONE_CONFIG")
          SRC_PREFIX=$(awk -F' *= *' '/^\[src\]/{f=1;next} /^\[/{f=0} f&&$1=="cdn_prefix"{print $2}' "$RCLONE_CONFIG")
          DST_PREFIX=$(awk -F' *= *' '/^\[dst\]/{f=1;next} /^\[/{f=0} f&&$1=="cdn_prefix"{print $2}' "$RCLONE_CONFIG")
          [ -n "$SRC_BUCKET" ] && [ -n "$DST_BUCKET" ] || { echo "::error::oss-migrate.conf 缺少 src/dst 的 bucket 字段"; exit 1; }
          [ -n "$SRC_PREFIX" ] && [ -n "$DST_PREFIX" ] || { echo "::error::oss-migrate.conf 缺少 src/dst 的 cdn_prefix 字段"; exit 1; }
          if [ -n "$PATH_PREFIX" ]; then
            echo "SRC=src:$SRC_BUCKET/$SRC_PREFIX/$PATH_PREFIX" >> "$GITHUB_ENV"
            echo "DST=dst:$DST_BUCKET/$DST_PREFIX/$PATH_PREFIX" >> "$GITHUB_ENV"
          else
            echo "SRC=src:$SRC_BUCKET/$SRC_PREFIX" >> "$GITHUB_ENV"
            echo "DST=dst:$DST_BUCKET/$DST_PREFIX" >> "$GITHUB_ENV"
          fi

      - name: Install rclone (custom build with download_host)
        run: |
          # 定制版 rclone:含 s3 后端 download_host(预签名 + CDN host 替换,
          # GET 与 HeadObject 均经 CDN),由公开库 CI 构建并发布 release
          for i in {1..3}; do
            if curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 5 \
              "https://github.com/yukaidi1220/rclone/releases/latest/download/rclone-cdn-linux-amd64" \
              -o /tmp/rclone; then
              break
            fi
            echo "拉取失败,重试 $i/3..."
            sleep $((i * 5))
          done
          [ -f /tmp/rclone ] || { echo "::error::无法拉取定制版 rclone,请检查 yukaidi1220/rclone 的 latest release"; exit 1; }
          chmod +x /tmp/rclone
          sudo mv /tmp/rclone /usr/local/bin/rclone
          rclone version

      # ---- 预检:签名 API 双向连通 ----
      # 注意:endpoint 域名是泛解析 *.oss-<region>.yukaidi.com,裸域名无 DNS。
      # 因此不能用 lsd(会触发 ListBuckets 打裸域名),必须用带桶名的操作
      # (size/lsjson 打 bucket.endpoint,命中泛解析)。
      - name: Preflight - signed API access (bucket-scoped)
        if: inputs.mode != 'cleanup'
        run: |
          rclone size "$SRC" --json > /dev/null 2>&1 || rclone lsjson "$SRC" --max-depth 1 > /dev/null
          echo "src signed API OK (bucket-scoped)"
          # 目标桶:列根目录(只读操作,不写任何数据)
          rclone lsjson "$DST" --max-depth 1 > /dev/null && echo "dst signed API OK (bucket-scoped)"

      # ---- 预检:源桶规模对账单 ----
      - name: Preflight - source stats
        if: inputs.mode != 'cleanup'
        run: |
          rclone size --json "$SRC" | tee source-size.json
          jq -r '"objects=\(.files) bytes=\(.bytes)"' source-size.json >> "$GITHUB_STEP_SUMMARY" || true

      # ---- 预检:经 CDN 预签名下载一个小对象,验证 host 替换链路 ----
      - name: Preflight - CDN presigned GET probe
        if: ${{ inputs.mode != 'cleanup' }}
        run: |
          if ! rclone config dump | jq -e '.src.download_host' > /dev/null 2>&1; then
            echo "未配置 download_host,下载将签名直连桶域名(跳过探测)"
            exit 0
          fi
          # probe 只为验证 CDN 链路,不值得为挑"最小文件"扫描全桶。
          # 用 rclone ls 流式输出(逐条打印)+ head -1:命中第一个
          # <=8MiB 文件立即 SIGPIPE 停止列举,大桶也秒级。
          # 兜底:全桶没有 <=8MiB 文件时取第一个文件(不限大小)。
          probe=$(rclone ls "$SRC" --files-only --min-size 1 --max-size 8Mi --fast-list 2>/dev/null | head -1 | sed -E 's/^[[:space:]]*[0-9]+[[:space:]]+//')
          if [ -z "$probe" ]; then
            probe=$(rclone ls "$SRC" --files-only --min-size 1 --fast-list 2>/dev/null | head -1 | sed -E 's/^[[:space:]]*[0-9]+[[:space:]]+//')
          fi
          if [ -z "$probe" ]; then
            echo "::warning::范围内没有 8MiB 以下的小文件,跳过 CDN 探测(正式复制时若 CDN 配置有误会直接报错)"
            exit 0
          fi
          expect=$(rclone lsjson "$SRC/$probe" | jq -r '.[0].Size')
          echo "probing: $probe ($expect bytes)"

          # 生成一个预签名 URL,先直连源桶验签,再走 CDN 验签,分离定位问题
          # ::add-mask:: 确保即使后续调试输出(echo/set-x/curl 报错)带上
          # 完整预签名 URL,也会在公开日志中被打码
          SIGN_URL=$(rclone link "$SRC/$probe" --expire 1h 2>/dev/null)
          if [ -n "$SIGN_URL" ]; then echo "::add-mask::$SIGN_URL"; fi
          if [ -z "$SIGN_URL" ]; then
            echo "::warning::rclone link 未生成预签名 URL,跳过对照,直接用 cat 探测"
          else
            CDN_HOST=$(rclone config dump | jq -r '.src.download_host')
            # 直连源桶(签名锚定 host)
            ORIGIN_CODE=$(curl -sS -o /tmp/direct.bin -w '%{http_code}' --max-time 30 "$SIGN_URL")
            ORIGIN_SIZE=$(stat -c%s /tmp/direct.bin 2>/dev/null || echo 0)
            echo "direct-to-origin: HTTP $ORIGIN_CODE, $ORIGIN_SIZE bytes"
            if [ "$ORIGIN_CODE" != "200" ]; then
              echo "::error::直连源桶验签失败(HTTP $ORIGIN_CODE)——rclone 预签名本身有问题,与 Worker 无关"
              head -c 300 /tmp/direct.bin || true
              exit 1
            fi
            # 走 CDN(Worker 改写回源):仅替换 URL 的 host 部分
            CDN_URL=$(printf '%s' "$SIGN_URL" | sed -E "s#^https://[^/]+/#https://$CDN_HOST/#")
            echo "cdn url host: $CDN_HOST"
            CDN_CODE=$(curl -sS -o /tmp/cdn.bin -w '%{http_code}' --max-time 30 "$CDN_URL")
            CDN_SIZE=$(stat -c%s /tmp/cdn.bin 2>/dev/null || echo 0)
            echo "via-cdn: HTTP $CDN_CODE, $CDN_SIZE bytes"
            if [ "$CDN_CODE" != "200" ]; then
              echo "::error::直连验签 OK 但经 CDN 失败(HTTP $CDN_CODE)——Worker 回源过程破坏了签名(query/路径编码或头改动)"
              head -c 300 /tmp/cdn.bin || true
              exit 1
            fi
            if [ "$CDN_SIZE" = "$expect" ]; then
              echo "CDN presigned GET OK"
              exit 0
            fi
          fi

          got=$(rclone cat "$SRC/$probe" | wc -c)
          echo "got: $got bytes"
          if [ "$got" -ne "$expect" ]; then
            echo "::error::CDN 预签名下载字节数($got)与源对象($expect)不符——请检查 download_host 与 endpoint(签名 Host=桶名.endpoint,须与 Worker 回源 Host 一致)"
            exit 1
          fi
          echo "CDN anonymous GET OK"

      # ---- 复制(dry-run 只模拟) ----
      - name: Copy (dry-run)
        if: inputs.mode == 'dry-run'
        run: |
          rclone copy "$SRC" "$DST" --dry-run --size-only \
            --fast-list --transfers 8 --checkers 16 \
            --stats-one-line --stats 60s -v 2>&1 | tee copy.log

      - name: Copy
        if: inputs.mode == 'copy'
        run: |
          set -o pipefail
          # --no-check-certificate: yukaidi.com CNAME 到 aliyuncs,阿里主机
          # 不出示 yukaidi 证书,HeadObject 等 SDK 请求会 TLS 验证失败
          # 定制版 rclone 会把 HeadObject(上传后验证/目标探测等)也经
          # download_host 预签名走 CDN。
          # --multi-thread-streams 1: 禁用多线程直写。CDN 对部分扩展名
          #   (.7z/.exe/.iso 等)的 Range 分段请求不可靠(2026-08-25 两轮
          #   抽样证实:多线程上传的大文件大小正确但内容错乱),改纯单流
          #   下载 + multipart 上传,用更高 --transfers 补速度。
          #   注意:rclone 语义里 --multi-thread-cutoff 0 是"全部启用"
          #   (size < cutoff 才跳过),禁用必须用 streams <= 1。
          # --s3-no-head: 海量小文件场景下,每文件 4 次跨洋往返中省掉
          #   上传验证这一次(延迟瓶颈);数据安全仍由下载侧 MD5 校验
          #   (corrupted on transfer 拦截)与 verify 模式抽样兜底。
          rclone copy "$SRC" "$DST" --no-check-certificate --size-only \
            --fast-list \
            --transfers 32 --checkers 32 \
            --multi-thread-streams 1 \
            --s3-chunk-size 64M --s3-upload-concurrency 2 \
            --s3-no-head \
            --retries 5 --low-level-retries 20 \
            --stats-one-line --stats 30s -v 2>&1 | tee copy.log


      # ---- 镜像同步(源桶持续写入/删除场景) ----
      - name: 'Sync (mirror: copies new/changed, deletes extra in dst)'
        if: inputs.mode == 'sync'
        run: |
          set -o pipefail
          # 与 Copy 完全相同的传输参数,但语义是镜像:
          #   源有目标没有 / 内容不一致 -> 传输覆盖
          #   目标有源没有             -> 删除(真正的镜像)
          # 用于源桶仍在实时写入、删除场景下的周期性追平:
          # 反复触发本模式即可使目标桶收敛为源桶的当前快照。
          # 注意:目标桶加密名前缀下任何"源桶没有的对象"都会被删除。
          # --size-only: 只比大小,size 一致即跳过。目标的 size 从
          # Content-Range 总长解析(精确可靠);不能用默认 modtime 比较
          # ——链路不回显 Last-Modified/x-amz-meta-mtime,会导致已传
          # 文件全部被判需更新而重传。同体积内容修改由 verify 抽样兜底。
          rclone sync --size-only "$SRC" "$DST" --no-check-certificate \
            --fast-list \
            --transfers 32 --checkers 32 \
            --multi-thread-streams 1 \
            --s3-chunk-size 64M --s3-upload-concurrency 2 \
            --s3-no-head \
            --retries 5 --low-level-retries 20 \
            --stats-one-line --stats 30s -v 2>&1 | tee sync.log

      # ---- [已禁用] 校验:全量 one-way 比对 ----
      # 禁用原因(2026-08-28 实测确认):
      #   SRC 桶对象为分片上传,ETag 是 "md5-N"(N=分片数),不是文件真实 MD5 ——
      #   SRC 桶的 MD5 不可得。
      #   DST 桶由本流程单流上传,ETag = 文件真实 MD5,但仅能拿到 DST 一侧。
      #   rclone check --one-way 需要两端都能算 hash 才有意义;SRC 侧 hash 不可得,
      #   导致 check 退化为纯 size 比对,而 size 一致性 sync --size-only 已保证,
      #   此阶段纯属徒劳。内容真实性改由 random sample 阶段验证。
      # 如需重新启用:把下方 if 条件改回 copy/sync/verify。
      - name: Verify - full one-way check [DISABLED]
        if: ${{ false }}
        run: |
          : > check.log
          echo "[1/3] 列举源桶(ls, 0 head)..."
          # 源桶只列 size+path(分片 ETag 无意义)。rclone ls 只列文件,无 --files-only flag。
          rclone ls "$SRC" --fast-list --no-check-certificate 2>/tmp/src_ls_err.log > /tmp/src_list.txt
          SRC_TOTAL=$(wc -l < /tmp/src_list.txt)
          echo "  源桶文件数: $SRC_TOTAL"
          if [ -s /tmp/src_ls_err.log ]; then
            echo "  [警告] src ls 有告警:"; head -3 /tmp/src_ls_err.log | sed 's/^/    /'
          fi

          echo "[2/3] 列举目标桶(lsjson --hash, 0 head 因 ETag=真实MD5)..."
          # 目标桶 lsjson --hash:ETag 即真实 MD5,列举时 setMD5FromEtag 直接赋值,不触发 head。
          rclone lsjson "$DST" --files-only --hash --fast-list \
            --no-check-certificate 2>/tmp/dst_lsjson_err.log > /tmp/dst_list.json
          DST_TOTAL=$(jq 'length' /tmp/dst_list.json)
          echo "  目标桶文件数: $DST_TOTAL"
          if [ -s /tmp/dst_lsjson_err.log ]; then
            echo "  [警告] dst lsjson 有告警:"; head -3 /tmp/dst_lsjson_err.log | sed 's/^/    /'
          fi

          echo "[3/3] 比对 size + 路径完整性..."
          # 统一为 "path<TAB>size" 排序后 join/comm 比对
          # src: rclone ls 输出 "  size path" → awk 取 size 和完整 path
          awk '{ size=$1; sub(/^[ \t]*[0-9]+[ \t]+/, ""); print $0 "\t" size }' /tmp/src_list.txt \
            | sort > /tmp/src_ps.tsv
          # dst: lsjson JSON → "path<TAB>size"
          jq -r '.[] | [.Path, (.Size|tostring)] | @tsv' /tmp/dst_list.json | sort > /tmp/dst_ps.tsv

          MISSING=$(comm -23 /tmp/src_ps.tsv /tmp/dst_ps.tsv | wc -l)
          EXTRA=$(comm -13 /tmp/src_ps.tsv /tmp/dst_ps.tsv | wc -l)
          SIZE_DIFF=$(join -t$'\t' /tmp/src_ps.tsv /tmp/dst_ps.tsv 2>/dev/null | awk -F'\t' '$2 != $3 {print}' | wc -l)
          SIZE_MATCH=$(join -t$'\t' /tmp/src_ps.tsv /tmp/dst_ps.tsv 2>/dev/null | awk -F'\t' '$2 == $3' | wc -l)

          echo "  missing in dst: $MISSING, extra in dst: $EXTRA, size match: $SIZE_MATCH, size mismatch: $SIZE_DIFF"

          {
            echo "### Verify - full manifest check"
            echo "- src files: $SRC_TOTAL"
            echo "- dst files: $DST_TOTAL"
            echo "- missing in dst: $MISSING"
            echo "- extra in dst: $EXTRA"
            echo "- size match: $SIZE_MATCH"
            echo "- size mismatch: $SIZE_DIFF"
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING file(s) in src missing in dst"
            comm -23 /tmp/src_ps.tsv /tmp/dst_ps.tsv | head -20 | tee -a check.log
            FAIL=1
          fi
          if [ "$EXTRA" -gt 0 ]; then
            echo "::warning::$EXTRA extra file(s) in dst (not in src)"
          fi
          if [ "$SIZE_DIFF" -gt 0 ]; then
            echo "::error::$SIZE_DIFF file(s) size mismatch"
            join -t$'\t' /tmp/src_ps.tsv /tmp/dst_ps.tsv 2>/dev/null | awk -F'\t' '$2 != $3 {print}' | head -20 | tee -a check.log
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Verify - full manifest check FAILED"
            exit 1
          fi
          echo "Verify - full manifest check PASSED ($SIZE_MATCH size match, $MISSING missing, $EXTRA extra)" | tee -a check.log
          echo "Verify - full manifest check PASSED" >> "$GITHUB_STEP_SUMMARY"

      # ---- 校验:随机抽 5 文件,下载源桶算 MD5 与目标桶 ETag(真实 MD5)比对 ----
      # MD5 可得性(2026-08-28 实测):
      #   SRC 桶为分片上传,ETag="md5-N",SRC 侧 MD5 不可得(故 full check 无意义已禁用)。
      #   DST 桶由本流程单流上传,ETag = 文件真实 MD5(直接可信)。
      #   因此:下载源桶文件算真实 MD5,与目标桶该文件的 ETag(=MD5)比对,无需下载目标桶。
      # 注意:绝不能用 "lsjson 全桶 -R" —— lsjson 默认输出 ModTime,对每个对象触发
      # head(走 CDN),692 个大文件会卡死(2026-08-28 实测)。改用:
      #   - 全桶列举用 rclone ls(递归,只取 size+path,0 head)确认存在
      #   - 单个抽样文件才用 lsjson <path> --hash(只 head 该文件 1 次)取 ETag
      - name: Verify - random sample (src download vs dst ETag)
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'sync' || inputs.mode == 'verify' }}
        run: |
          : > sample.log
          echo "[1/4] 列举源桶文件清单(流式, 0 head)..."
          # rclone ls 只列文件(无 --files-only flag,加了会 UsageError)。只取 size+path。
          rclone ls "$SRC" --fast-list --no-check-certificate 2>/tmp/ls_err.log > /tmp/src_files.txt
          TOTAL=$(wc -l < /tmp/src_files.txt)
          echo "  文件总数: $TOTAL"
          if [ -s /tmp/ls_err.log ]; then
            echo "  [警告] ls 有告警输出(截取前3行):"
            head -3 /tmp/ls_err.log | sed 's/^/    /'
          fi
          if [ "$TOTAL" -eq 0 ]; then
            echo "::warning::源桶没有文件,抽样比对跳过"
            echo "random sample SKIPPED (empty source)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "[2/4] 列举目标桶文件清单(ls, 0 head, 仅确认存在)..."
          # 目标桶用 rclone ls(递归, 0 head),不用 lsjson(会 ModTime head 卡死)。
          # 用于确认抽样的文件在目标桶存在。
          rclone ls "$DST" --fast-list --no-check-certificate 2>/tmp/dst_ls_err.log > /tmp/dst_files.txt
          DST_TOTAL=$(wc -l < /tmp/dst_files.txt)
          echo "  目标桶文件数: $DST_TOTAL"
          if [ -s /tmp/dst_ls_err.log ]; then
            echo "  [警告] dst ls 有告警(截取前3行):"
            head -3 /tmp/dst_ls_err.log | sed 's/^/    /'
          fi

          echo "[3/4] 随机抽取 5 个文件并比对..."
          # 抽 5 行 "  size path"
          shuf -n 5 /tmp/src_files.txt > /tmp/picks.txt
          cat -n /tmp/picks.txt | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+/    样本 \1: /'

          fail=0
          idx=0
          while IFS= read -r line; do
            idx=$((idx+1))
            [ -z "$line" ] && continue
            fsize=$(printf '%s' "$line" | awk '{print $1}')
            fpath=$(printf '%s' "$line" | sed -E 's/^[[:space:]]*[0-9]+[[:space:]]+//')
            echo "  ---- 样本 $idx/5: $fpath ($fsize bytes) ----"
            echo "== sample $idx: $fpath ($fsize bytes)" | tee -a sample.log

            # 确认目标桶存在该文件(用 ls 清单,按路径查找)
            if ! grep -Fqx "$fpath" <(sed -E 's/^[[:space:]]*[0-9]+[[:space:]]+//' /tmp/dst_files.txt); then
              echo "   [错误] 目标桶中不存在该文件" | tee -a sample.log
              fail=1
              continue
            fi

            # 取目标桶该文件 ETag(=真实MD5)。单文件 lsjson,只 head 1 次。
            dst_json=$(rclone lsjson "$DST/$fpath" --hash --no-check-certificate 2>/tmp/dst_lsjson_single.log)
            dst_rc=$?
            echo "   [debug] 单文件 lsjson 退出码: $dst_rc"
            if [ -s /tmp/dst_lsjson_single.log ]; then
              echo "   [debug] stderr(前3行):"
              head -3 /tmp/dst_lsjson_single.log | sed 's/^/      /'
            fi
            if [ -n "$dst_json" ]; then
              echo "   [debug] 返回: $(echo "$dst_json" | head -c 200)"
            else
              echo "   [debug] 返回: (空)"
            fi
            dst_md5=$(echo "$dst_json" | jq -r '.[0].Hashes.MD5 // ""' 2>/dev/null)
            if [ -z "$dst_md5" ]; then
              echo "   [错误] 目标桶取不到 ETag(MD5)" | tee -a sample.log
              fail=1
              continue
            fi
            echo "   dst ETag(MD5): $dst_md5"

            # 只下载源桶算 MD5(目标桶 ETag 已可信,不重复下载)
            if ! timeout 900 rclone cat "$SRC/$fpath" --no-check-certificate 2>/tmp/src_cat.log | md5sum | awk '{print $1}' > /tmp/src_md5.txt; then
              echo "   [错误] src 下载失败: $(head -1 /tmp/src_cat.log)" | tee -a sample.log
              fail=1
              continue
            fi
            src_md5=$(cat /tmp/src_md5.txt)
            echo "   src md5: $src_md5 (下载源桶计算)"

            if [ "$src_md5" = "$dst_md5" ]; then
              echo "   MATCH (源桶下载 MD5 == 目标桶 ETag)" | tee -a sample.log
            else
              echo "   MISMATCH -> 删除目标桶坏文件以便重传" | tee -a sample.log
              rclone deletefile "$DST/$fpath" --no-check-certificate
              fail=1
            fi
          done < /tmp/picks.txt

          echo "[4/4] 汇总..."
          if [ "$fail" != "0" ]; then
            echo "::warning::抽样发现不一致或下载失败,详情见 sample.log;重跑 copy 模式即可自动重传"
            echo "REPAIRED=1" >> "$GITHUB_ENV"
            echo "::error::random sample FAILED (详见 sample.log)"
            exit 1
          fi
          echo "random sample PASSED ($idx files: src MD5 == dst ETag)" | tee -a sample.log
          echo "random sample PASSED ($idx files)" >> "$GITHUB_STEP_SUMMARY"

      # ---- 清理目标桶孤儿分片(copy 被强杀后的残留) ----
      - name: Cleanup aborted multipart uploads
        if: inputs.mode == 'cleanup'
        run: "rclone cleanup dst: -v"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-migrate-logs-${{ github.run_number }}
          path: |
            source-size.json
            copy.log
            sync.log
            check.log
            sample.log
          if-no-files-found: ignore

      - name: Remove fetched config
        if: always()
        run: |
          if [ -f "$RCLONE_CONFIG" ]; then shred -u "$RCLONE_CONFIG" || rm -f "$RCLONE_CONFIG"; fi
