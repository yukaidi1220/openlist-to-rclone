# 跨账号、跨地域 阿里云 OSS 桶迁移(CDN 预签名下载版)
#
# 原理:源桶 remote 配置 download_host 后,rclone 对对象读操作(GET 与
# HeadObject)生成 SigV4 预签名 URL(签名锚定 endpoint,即桶名.endpoint
# 的自定义域名),仅把 URL host 替换为 CDN 域名后发出;Cloudflare Worker
# 按原 host 回源,OSS 验签通过。列表/上传仍走签名 endpoint,与生产下载
# 链路同构。
# 需要定制版 rclone(含 download_host 选项),由公开库 yukaidi1220/rclone
# 的 CI 构建并发布 release,此处直接拉取 latest。
#
# 凭据管理(本工作流在公开仓库运行,故凭据绝不经由 inputs 传入):
#   入口在私有仓 rclone-action 的 "OSS Migrate launcher" 工作流:
#   在那里填入新旧桶与 CDN 信息 → 自动生成/提交 oss-migrate.conf 到私有仓
#   → 再由它触发本工作流。本工作流运行时用已有的 secrets.RCLONE_PAT
#   通过 GitHub API 拉取 oss-migrate.conf——凭据不进任何 run 历史,
#   不新建 secret,公开库无 Actions 时长上限。
#
# 用法(正常情况下不需要直接触发本工作流,去私有仓的 launcher 触发):
#   mode:
#     dry-run  连通性自检 + 模拟复制,不写任何数据(首次必跑)
#     copy     正式迁移,结束后自动执行校验
#     verify   只做校验(copy 因超时中断后可单独补跑)
#     cleanup  清理目标桶残留的分片上传(job 被强杀后的孤儿分片)
#   path: 留空 = 整个桶;填子路径如 "logs/2024" 则只迁移该前缀
#   (可用于先小规模试跑)。
#
# 断点续传:GitHub 单 job 上限 6 小时(本工作流设 350 分钟)。数据量大时
# copy 会被截断:rclone 会跳过已完成的文件,重新触发即续传,循环直到一轮
# 完整跑完;再跑一次 copy 让校验 PASSED 即为终态。

name: OSS Migrate (cross-account CDN)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        required: true
        default: "dry-run"
        options:
          - dry-run
          - copy
          - verify
          - cleanup
      path:
        description: "迁移路径前缀(留空=整桶,如 logs/2024)"
        required: false
        default: ""

concurrency:
  group: oss-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RCLONE_CONFIG: /tmp/oss-migrate.conf
    steps:
      - name: Fetch oss-migrate.conf from private repo
        env:
          RCLONE_PAT: ${{ secrets.RCLONE_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          umask 077
          for i in {1..3}; do
            if curl -fsSL --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 5 \
              -H "Authorization: token $RCLONE_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/oss-migrate.conf" \
              -o "$RCLONE_CONFIG"; then
              echo "配置获取成功"
              break
            fi
            echo "获取失败,重试 $i/3..."
            sleep $((i * 5))
          done
          [ -f "$RCLONE_CONFIG" ] || { echo "::error::无法获取 oss-migrate.conf,请检查 RCLONE_PAT 权限或私有仓中是否存在该文件"; exit 1; }

      - name: Parse config & set paths
        env:
          PATH_PREFIX: ${{ inputs.path }}
        run: |
          # 从配置读取桶名与 RC4 加密名,拼出远端路径(src:/dst:)。
          # 桶内对象 key 自带加密桶名前缀(Worker 回源不剥首段),因此
          # 用 path 前缀做映射:src 读 afa0baf1/X,写入 dst 变为 afa0baf6/X。
          # 注意:s3 后端没有 root 配置项,conf 里的 root 会被忽略,绝不能
          # 依赖它做前缀注入(曾因此把源前缀原样复制进目标桶)。
          SRC_BUCKET=$(awk -F' *= *' '/^\[src\]/{f=1;next} /^\[/{f=0} f&&$1=="bucket"{print $2}' "$RCLONE_CONFIG")
          DST_BUCKET=$(awk -F' *= *' '/^\[dst\]/{f=1;next} /^\[/{f=0} f&&$1=="bucket"{print $2}' "$RCLONE_CONFIG")
          SRC_PREFIX=$(awk -F' *= *' '/^\[src\]/{f=1;next} /^\[/{f=0} f&&$1=="cdn_prefix"{print $2}' "$RCLONE_CONFIG")
          DST_PREFIX=$(awk -F' *= *' '/^\[dst\]/{f=1;next} /^\[/{f=0} f&&$1=="cdn_prefix"{print $2}' "$RCLONE_CONFIG")
          [ -n "$SRC_BUCKET" ] && [ -n "$DST_BUCKET" ] || { echo "::error::oss-migrate.conf 缺少 src/dst 的 bucket 字段"; exit 1; }
          [ -n "$SRC_PREFIX" ] && [ -n "$DST_PREFIX" ] || { echo "::error::oss-migrate.conf 缺少 src/dst 的 cdn_prefix 字段"; exit 1; }
          if [ -n "$PATH_PREFIX" ]; then
            echo "SRC=src:$SRC_BUCKET/$SRC_PREFIX/$PATH_PREFIX" >> "$GITHUB_ENV"
            echo "DST=dst:$DST_BUCKET/$DST_PREFIX/$PATH_PREFIX" >> "$GITHUB_ENV"
          else
            echo "SRC=src:$SRC_BUCKET/$SRC_PREFIX" >> "$GITHUB_ENV"
            echo "DST=dst:$DST_BUCKET/$DST_PREFIX" >> "$GITHUB_ENV"
          fi
          echo "SRC=$SRC"
          echo "DST=$DST"

      - name: Install rclone (custom build with download_host)
        run: |
          # 定制版 rclone:含 s3 后端 download_host(预签名 + CDN host 替换,
          # GET 与 HeadObject 均经 CDN),由公开库 CI 构建并发布 release
          for i in {1..3}; do
            if curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 5 \
              "https://github.com/yukaidi1220/rclone/releases/latest/download/rclone-cdn-linux-amd64" \
              -o /tmp/rclone; then
              break
            fi
            echo "拉取失败,重试 $i/3..."
            sleep $((i * 5))
          done
          [ -f /tmp/rclone ] || { echo "::error::无法拉取定制版 rclone,请检查 yukaidi1220/rclone 的 latest release"; exit 1; }
          chmod +x /tmp/rclone
          sudo mv /tmp/rclone /usr/local/bin/rclone
          rclone version

      # ---- 预检:签名 API 双向连通 ----
      # 注意:endpoint 域名是泛解析 *.oss-<region>.yukaidi.com,裸域名无 DNS。
      # 因此不能用 lsd(会触发 ListBuckets 打裸域名),必须用带桶名的操作
      # (size/lsjson 打 bucket.endpoint,命中泛解析)。
      - name: Preflight - signed API access (bucket-scoped)
        if: inputs.mode != 'cleanup'
        run: |
          rclone size "$SRC" --json > /dev/null 2>&1 || rclone lsjson "$SRC" --max-depth 1 > /dev/null
          echo "src signed API OK (bucket-scoped)"
          # 目标桶:列根目录(只读操作,不写任何数据)
          rclone lsjson "$DST" --max-depth 1 > /dev/null && echo "dst signed API OK (bucket-scoped)"

      # ---- 预检:源桶规模对账单 ----
      - name: Preflight - source stats
        if: inputs.mode != 'cleanup'
        run: |
          rclone size --json "$SRC" | tee source-size.json
          jq -r '"objects=\(.files) bytes=\(.bytes)"' source-size.json >> "$GITHUB_STEP_SUMMARY" || true

      # ---- 预检:经 CDN 预签名下载一个小对象,验证 host 替换链路 ----
      - name: Preflight - CDN presigned GET probe
        if: ${{ inputs.mode != 'cleanup' }}
        run: |
          if ! rclone config dump | jq -e '.src.download_host' > /dev/null 2>&1; then
            echo "未配置 download_host,下载将签名直连桶域名(跳过探测)"
            exit 0
          fi
          probe=$(rclone lsjson "$SRC" -R --files-only --min-size 1 --max-size 8Mi \
                    | jq -r 'sort_by(.Size) | .[0].Path // empty')
          if [ -z "$probe" ]; then
            echo "::warning::范围内没有 8MiB 以下的小文件,跳过 CDN 探测(正式复制时若 CDN 配置有误会直接报错)"
            exit 0
          fi
          expect=$(rclone lsjson "$SRC/$probe" | jq -r '.[0].Size')
          echo "probing: $probe ($expect bytes)"

          # 生成一个预签名 URL,先直连源桶验签,再走 CDN 验签,分离定位问题
          SIGN_URL=$(rclone link "$SRC/$probe" --expire 1h 2>/dev/null)
          if [ -z "$SIGN_URL" ]; then
            echo "::warning::rclone link 未生成预签名 URL,跳过对照,直接用 cat 探测"
          else
            CDN_HOST=$(rclone config dump | jq -r '.src.download_host')
            # 直连源桶(签名锚定 host)
            ORIGIN_CODE=$(curl -sS -o /tmp/direct.bin -w '%{http_code}' --max-time 30 "$SIGN_URL")
            ORIGIN_SIZE=$(stat -c%s /tmp/direct.bin 2>/dev/null || echo 0)
            echo "direct-to-origin: HTTP $ORIGIN_CODE, $ORIGIN_SIZE bytes"
            if [ "$ORIGIN_CODE" != "200" ]; then
              echo "::error::直连源桶验签失败(HTTP $ORIGIN_CODE)——rclone 预签名本身有问题,与 Worker 无关"
              head -c 300 /tmp/direct.bin || true
              exit 1
            fi
            # 走 CDN(Worker 改写回源):仅替换 URL 的 host 部分
            CDN_URL=$(printf '%s' "$SIGN_URL" | sed -E "s#^https://[^/]+/#https://$CDN_HOST/#")
            echo "cdn url host: $CDN_HOST"
            CDN_CODE=$(curl -sS -o /tmp/cdn.bin -w '%{http_code}' --max-time 30 "$CDN_URL")
            CDN_SIZE=$(stat -c%s /tmp/cdn.bin 2>/dev/null || echo 0)
            echo "via-cdn: HTTP $CDN_CODE, $CDN_SIZE bytes"
            if [ "$CDN_CODE" != "200" ]; then
              echo "::error::直连验签 OK 但经 CDN 失败(HTTP $CDN_CODE)——Worker 回源过程破坏了签名(query/路径编码或头改动)"
              head -c 300 /tmp/cdn.bin || true
              exit 1
            fi
            if [ "$CDN_SIZE" = "$expect" ]; then
              echo "CDN presigned GET OK"
              exit 0
            fi
          fi

          got=$(rclone cat "$SRC/$probe" | wc -c)
          echo "got: $got bytes"
          if [ "$got" -ne "$expect" ]; then
            echo "::error::CDN 预签名下载字节数($got)与源对象($expect)不符——请检查 download_host 与 endpoint(签名 Host=桶名.endpoint,须与 Worker 回源 Host 一致)"
            exit 1
          fi
          echo "CDN anonymous GET OK"

      # ---- 复制(dry-run 只模拟) ----
      - name: Copy (dry-run)
        if: inputs.mode == 'dry-run'
        run: |
          rclone copy "$SRC" "$DST" --dry-run \
            --fast-list --transfers 8 --checkers 16 \
            --stats-one-line --stats 60s -v 2>&1 | tee copy.log

      - name: Copy
        if: inputs.mode == 'copy'
        run: |
          set -o pipefail
          # --no-check-certificate: yukaidi.com CNAME 到 aliyuncs,阿里主机
          # 不出示 yukaidi 证书,HeadObject 等 SDK 请求会 TLS 验证失败
          # 定制版 rclone 会把 HeadObject(上传后验证/目标探测等)也经
          # download_host 预签名走 CDN。
          # --multi-thread-streams 1: 禁用多线程直写。CDN 对部分扩展名
          #   (.7z/.exe/.iso 等)的 Range 分段请求不可靠(2026-08-25 两轮
          #   抽样证实:多线程上传的大文件大小正确但内容错乱),改纯单流
          #   下载 + multipart 上传,用更高 --transfers 补速度。
          #   注意:rclone 语义里 --multi-thread-cutoff 0 是"全部启用"
          #   (size < cutoff 才跳过),禁用必须用 streams <= 1。
          rclone copy "$SRC" "$DST" --no-check-certificate \
            --fast-list \
            --transfers 16 --checkers 32 \
            --multi-thread-streams 1 \
            --s3-chunk-size 64M --s3-upload-concurrency 2 \
            --retries 5 --low-level-retries 20 \
            --stats-one-line --stats 30s -v 2>&1 | tee copy.log

      # ---- 校验:全量清单比对(非分片文件比 MD5,分片上传的退化为比大小+元数据) ----
      - name: Verify - full one-way check
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'verify' }}
        run: |
          set -o pipefail
          rclone check "$SRC" "$DST" --one-way -v --no-check-certificate 2>&1 | tee check.log
          echo "full one-way check PASSED" >> "$GITHUB_STEP_SUMMARY"

      # ---- 校验:随机抽 5 个文件双端逐字节比对(--download 会真实下载两端内容) ----
      - name: Verify - random sample byte-compare
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'verify' }}
        run: |
          rclone lsjson "$SRC" -R --files-only > files.json
          total=$(jq 'length' files.json)
          echo "total files: $total"
          mapfile -t picks < <(jq -r '.[].Path' files.json | shuf -n 5)
          : > sample.log
          fail=0
          for p in "${picks[@]}"; do
            size=$(jq -r --arg p "$p" '.[] | select(.Path==$p) | .Size' files.json)
            echo "== sample: $p ($size bytes)" | tee -a sample.log
            # 单文件比对:分别下载两端内容,逐字节比较哈希
            src_md5=$(rclone cat "$SRC/$p" | md5sum | awk '{print $1}')
            dst_md5=$(rclone cat "$DST/$p" | md5sum | awk '{print $1}')
            echo "   src md5: $src_md5" | tee -a sample.log
            echo "   dst md5: $dst_md5" | tee -a sample.log
            if [ "$src_md5" != "$dst_md5" ]; then
              echo "   MISMATCH -> 删除目标桶坏文件以便重传" | tee -a sample.log
              rclone deletefile "$DST/$p"
              fail=1
            else
              echo "   MATCH" | tee -a sample.log
            fi
          done
          if [ "$fail" != "0" ]; then
            echo "::warning::抽样发现内容不一致的目标文件已被删除,重跑 copy 模式即可自动重传(源桶未做任何改动)"
            echo "REPAIRED=1" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "random sample byte-compare PASSED (5 files)" >> "$GITHUB_STEP_SUMMARY"

      # ---- 清理目标桶孤儿分片(copy 被强杀后的残留) ----
      - name: Cleanup aborted multipart uploads
        if: inputs.mode == 'cleanup'
        run: "rclone cleanup dst: -v"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-migrate-logs-${{ github.run_number }}
          path: |
            source-size.json
            copy.log
            check.log
            sample.log
          if-no-files-found: ignore

      - name: Remove fetched config
        if: always()
        run: |
          if [ -f "$RCLONE_CONFIG" ]; then shred -u "$RCLONE_CONFIG" || rm -f "$RCLONE_CONFIG"; fi
