# OSS → 天翼云盘(cloud189) 迁移执行器(公开仓运行,凭据经私有仓 conf 注入)
#
# 与 oss2wopan.yml / oss2yun139.yml 同架构,目标端换成 cloud189 个人云:
#   - 源端:列表/元数据走签名 API,内容经 CDN 预签名下载(download_host)
#   - 目标端:cloud189(天翼云盘)直传;落盘 <dst_base>/<原 key>(launcher 默认 s3-bak/<源桶名>)
#   - 令牌:conf 里的 access_token(32 字符)。它不轮换——后端每次会话自己用 accessToken
#     换 sessionKey,所以公开仓【不需要】no_refresh 之类的旗标,也没有续期步骤。
#
# cloud189 的既有取舍(详见 rclone docs/content/cloud189.md):
#   - mtime 不可改 → 必须 --size-only,否则每轮全量重传
#   - 空文件拒收(fs.ErrorCantUploadEmptyFiles)→ 由 verify 的"预期跳过"名单吸收,
#     不喂 --exclude-from(glob 语义会误排真文件),仍用 bin/skipdiff.sh 做纯字符串相减
#   - 秒传按内容去重:同内容会返回已存在对象的 id;后端按 id 核对,不会跨目录搬别人的文件
#   - 服务端 COPY/MOVE 是异步任务且忽略任务里的 fileName(按源名字落地),后端已处理
#   - 长传输会被存储层中途掐断:后端对整对象读取做有界续传(最多 4 次)
#
# 断点语义:copy 粒度为整文件,重跑按 --size-only 跳过已存在文件。

name: OSS2cloud189 migrate
run-name: OSS2cloud189 migrate (${{ inputs.src_bucket }} | ${{ inputs.cdn_base }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        required: true
        default: "dry-run"
        options:
          - dry-run
          - copy
          - sync
          - verify
      path:
        description: "迁移路径前缀(留空=整个目标基路径,相对 <dst_base>)。须为目录/前缀作用域,勿传单个文件"
        required: false
        default: ""
      src_bucket:
        description: "源桶名(launcher 自动填入,用于并发分组与 dstbase 缺省;手动直触可空)"
        required: false
        default: ""
      config_file:
        description: "私有仓配置文件路径(相对仓库根。launcher 生成的时间戳配置在 oss2cloud189-configs/ 下;留默认用根目录 oss2cloud189.conf)"
        required: false
        default: "oss2cloud189.conf"
      cdn_base:
        description: "源桶 CDN 下载域名(仅用于 run 标题辨识;实际下载域在 conf 的 download_host)"
        required: false
        default: ""
      dump_trace:
        description: "本轮给 rclone 加 --dump trace:打印每次请求的 DNS/拨号/TLS 与 GotConn 的本地->远端地址(reused 也打)。不打请求头故不会漏 token,但每请求约 8 行,只在复现那一轮勾"
        type: boolean
        required: false
        default: false

concurrency:
  # 目标端没有会话互踢的问题(access_token 不轮换),全部 run 按桶+路径分组即可并行。
  group: oss2cloud189-${{ inputs.src_bucket }}-${{ inputs.path }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Shanghai
      RCLONE_CONFIG: /tmp/oss2cloud189.conf
    steps:
      - name: 检出仓库(含 bin/skipdiff.sh)
        uses: actions/checkout@v6

      - name: Fetch config from private repo
        env:
          RCLONE_PAT: ${{ secrets.RCLONE_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
          CONF_PATH: ${{ inputs.config_file }}
        run: |
          umask 077
          CONF_PATH="${CONF_PATH:-oss2cloud189.conf}"
          DSTBASE_PATH="${CONF_PATH%.conf}.dstbase"
          echo "config: $CONF_PATH / dstbase: $DSTBASE_PATH"
          for i in {1..3}; do
            if curl -fsSL --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 5 \
              -H "Authorization: token $RCLONE_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/$CONF_PATH" \
              -o "$RCLONE_CONFIG" \
              && curl -fsSL --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 5 \
              -H "Authorization: token $RCLONE_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/$DSTBASE_PATH" \
              -o /tmp/dstbase; then
              echo "配置获取成功"
              break
            fi
            echo "获取失败,重试 $i/3..."
            sleep $((i * 5))
          done
          [ -f "$RCLONE_CONFIG" ] || { echo "::error::无法获取 $CONF_PATH"; exit 1; }
          [ -f /tmp/dstbase ] || { echo "::error::无法获取 $DSTBASE_PATH"; exit 1; }

      - name: Parse config & set paths
        env:
          PATH_PREFIX: ${{ inputs.path }}
        run: |
          SRC_BUCKET=$(grep '^bucket' "$RCLONE_CONFIG" | tr -s ' ' | cut -d' ' -f3 | head -1)
          [ -n "$SRC_BUCKET" ] || { echo "::error::conf 缺少 src.bucket"; exit 1; }
          grep -A20 '^\[cloud189\]' "$RCLONE_CONFIG" | grep -qE '^access_token[ \t]*=' \
            || { echo "::error::conf [cloud189] 缺少 access_token"; exit 1; }
          DST_BASE=$(cat /tmp/dstbase)
          PARAM_PREFIX="$PATH_PREFIX"
          if [ -n "$PARAM_PREFIX" ]; then
            SRC="src:$SRC_BUCKET/$PARAM_PREFIX"
            DST="cloud189:$DST_BASE/$PARAM_PREFIX"
          else
            SRC="src:$SRC_BUCKET"
            DST="cloud189:$DST_BASE"
          fi
          { echo "set -a"; echo "SRC=$SRC"; echo "DST=$DST"; echo "set +a"; } > /tmp/paths.src
          echo "== paths.src =="
          cat /tmp/paths.src

      - name: "Install rclone (custom build: s3 download_host + cloud189)"
        run: |
          URL="https://github.com/yukaidi1220/rclone/releases/latest/download/rclone-cdn-linux-amd64"
          curl -fsSL --connect-timeout 15 --max-time 300 --retry 3 --retry-delay 5 \
            -o /tmp/rclone "$URL" || { echo "::error::无法下载 rclone release"; exit 1; }
          chmod +x /tmp/rclone
          sudo mv /tmp/rclone /usr/local/bin/rclone
          rclone version | head -2
          # --dump trace 只打连接级事件,不打请求头,不会把 access_token 写进日志。
          if [ "${{ inputs.dump_trace }}" = "true" ]; then
            echo "RCLONE_DUMP=trace" >> "$GITHUB_ENV"
            echo ">>> 本轮连接级 trace 已开:在 copy.log 里搜 \"Got connection\" 即见 local -> remote 与 reused"
          else
            echo ">>> 本轮连接级 trace 未开(dump_trace=false)"
          fi

      # ---- 预检 ----
      - name: Preflight - source bucket scoped
        run: |
          . /tmp/paths.src
          set -o pipefail
          rclone size "$SRC" --json --no-check-certificate > /tmp/size.json
          jq -r '"objects=\(.count // .files) bytes=\(.bytes)"' /tmp/size.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SRC_BYTES=$(jq -r '.bytes // 0' /tmp/size.json)" >> "$GITHUB_ENV"

      - name: Preflight - cloud189 connectivity and space
        run: |
          # 连得上才有意义谈后面:这是一次真实的 API 往返(about),不是只解析 conf。
          rclone about --json cloud189: > /tmp/about.json \
            || { echo "::error::cloud189 不可达(access_token 失效或接口变更)"; exit 1; }
          TOTAL=$(jq -r '.total // 0' /tmp/about.json)
          FREE=$(jq -r '.free // 0' /tmp/about.json)
          jq -r '"target total=\(.total // "?") used=\(.used // "?") free=\(.free // "?")"' /tmp/about.json | tee -a "$GITHUB_STEP_SUMMARY"
          SRC_BYTES="${SRC_BYTES:-0}"
          # 目标放不下就现在停下:半路跑满会让一整轮变成失败,而且看不出是空间问题。
          if [ "$FREE" -gt 0 ] && [ "$SRC_BYTES" -gt 0 ] && [ "$SRC_BYTES" -gt "$FREE" ]; then
            echo "::error::目标剩余空间 $FREE 字节小于源 $SRC_BYTES 字节,拒绝开跑"
            exit 1
          fi
          echo "cloud189 OK (free=$FREE, src=$SRC_BYTES)"

      - name: Preflight - 源必须是目录
        run: |
          . /tmp/paths.src
          # copy/sync 是目录→目录语义;把单个文件当路径传进来会变成"以文件名为目录"。
          if rclone lsjson "$SRC" --no-mimetype --no-modtime --no-check-certificate 2>/dev/null \
             | jq -e 'type == "array" and length == 1 and .[0].IsDir == false' >/dev/null; then
            echo "::error::$SRC 看起来是单个文件;请传目录/前缀"
            exit 1
          fi
          echo "source is a directory scope"

      # ---- 搬运 ----
      - name: Copy (dry-run)
        if: inputs.mode == 'dry-run'
        run: |
          . /tmp/paths.src
          set -o pipefail
          rclone copy "$SRC" "$DST" --dry-run \
            --size-only --ignore-checksum --no-check-certificate \
            --transfers 4 --checkers 8 \
            --stats 60s -v 2>&1 | tee copy.log
          rclone sync "$SRC" "$DST" --dry-run \
            --size-only --ignore-checksum --no-check-certificate \
            --transfers 4 --checkers 8 \
            --stats 60s -v 2>&1 | tee -a copy.log

      - name: Copy
        if: inputs.mode == 'copy'
        run: |
          . /tmp/paths.src
          set -o pipefail
          set +e
          rclone copy "$SRC" "$DST" \
            --size-only --ignore-checksum --no-check-certificate --ignore-errors \
            --transfers 8 --checkers 8 \
            --retries 3 --low-level-retries 3 \
            --stats 30s -vv 2>&1 | tee copy.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # 空文件是后端的硬拒收,不是传输故障:这类错误交给 verify 的预期跳过名单吸收。
            OTHER=$(grep -a '^ERROR : ' copy.log | grep -av 'empty files' | head -20)
            if [ -n "$OTHER" ]; then
              echo "::error::rclone exit=$rc,且有不是空文件的错误:"
              echo "$OTHER"
              exit "$rc"
            fi
            echo "::warning::rclone exit=$rc,错误仅涉及空文件(交给 verify 判定)"
          fi

      - name: Sync
        if: inputs.mode == 'sync'
        run: |
          . /tmp/paths.src
          set -o pipefail
          set +e
          rclone sync "$SRC" "$DST" \
            --size-only --ignore-checksum --no-check-certificate --ignore-errors \
            --transfers 8 --checkers 8 \
            --retries 3 --low-level-retries 3 \
            --stats 30s -vv 2>&1 | tee copy.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            OTHER=$(grep -a '^ERROR : ' copy.log | grep -av 'empty files' | head -20)
            if [ -n "$OTHER" ]; then
              echo "::error::rclone exit=$rc,且有不是空文件的错误:"
              echo "$OTHER"
              exit "$rc"
            fi
            echo "::warning::rclone exit=$rc,错误仅涉及空文件(交给 verify 判定)"
          fi

      # ---- 校验 ----
      - name: Verify - full one-way check (size, cloud189 mtime 不可改→size-only)
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'sync' || inputs.mode == 'verify' }}
        run: |
          . /tmp/paths.src
          set -o pipefail
          set +e
          # 名单不喂 --exclude-from(glob 语义会误排真文件),而是由 skipdiff 做纯字符串相减。
          # 本后端的"明确不传"只有一种:空文件(后端拒收)。copy/sync 轮从 copy.log 取,
          # 独立 verify 轮没有 copy 阶段,按源端 Size==0 反推。
          SKIP_SRC=copy.log
          if [ ! -f copy.log ]; then
            rclone lsjson "$SRC" -R --files-only --no-mimetype --no-modtime --no-check-certificate -vv \
              2>/dev/null | jq -r '.[] | select(.Size == 0) | .Path' | sort -u > /tmp/expected-skip.txt
            export EXPECTED_SKIP=/tmp/expected-skip.txt
            echo "expected-skip(空文件)= $(wc -l < /tmp/expected-skip.txt)"
            SKIP_SRC=-
          else
            grep -aoE 'ERROR : .*: Failed to copy: .*empty files' copy.log \
              | sed -E 's/^ERROR : //; s/: Failed to copy: .*//' | sort -u > /tmp/expected-skip.txt
            export EXPECTED_SKIP=/tmp/expected-skip.txt
            echo "expected-skip(空文件,来自 copy.log)= $(wc -l < /tmp/expected-skip.txt)"
            SKIP_SRC=-
          fi
          rclone check "$SRC" "$DST" --one-way --size-only --ignore-errors \
            --checkers 16 --transfers 4 --no-check-certificate -v 2>&1 | tee check.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "full one-way size check done (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
          chmod +x bin/skipdiff.sh
          bash bin/skipdiff.sh "$SKIP_SRC" check.log "$rc" | tee -a /tmp/skipdiff.out
          sdc=${PIPESTATUS[0]}
          head -1 /tmp/skipdiff.out >> "$GITHUB_STEP_SUMMARY"
          if [ "$sdc" -ne 0 ]; then exit "$sdc"; fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss2cloud189-${{ inputs.mode }}-${{ inputs.src_bucket }}-${{ github.run_id }}
          path: |
            copy.log
            check.log
            /tmp/skipdiff.out
            /tmp/expected-skip.txt
          if-no-files-found: ignore
          retention-days: 14
