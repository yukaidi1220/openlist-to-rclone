          # CRITICAL "can't limit to single files"。单文件 CDN 预检不适用,内容完整性由 copy/verify 兜底。
          if rclone lsjson "$SRC" --no-check-certificate --no-mimetype --no-modtime 2>/dev/null             | jq -e 'length==1 and .[0].IsDir==false' >/dev/null 2>&1; then
