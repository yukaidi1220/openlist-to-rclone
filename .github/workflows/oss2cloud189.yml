          fi
          rclone check "$SRC" "$DST" --one-way --size-only --ignore-errors \
            --checkers 16 --transfers 4 --no-check-certificate -v 2>&1 | sed -uE 's/(session[_-]?[Kk]ey=)[^,"[:space:]]+/\1***/g' | tee check.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "full one-way size check done (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
          chmod +x bin/skipdiff.sh
          bash bin/skipdiff.sh "$SKIP_SRC" check.log "$rc" | tee -a /tmp/skipdiff.out
          sdc=${PIPESTATUS[0]}
          head -1 /tmp/skipdiff.out >> "$GITHUB_STEP_SUMMARY"
          if [ "$sdc" -ne 0 ]; then exit "$sdc"; fi

      - name: Verify - random sample content (分片抽样,不再整文件下载)
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'sync' || inputs.mode == 'verify' }}
        env:
          RCLONE: rclone
          SLICE: "2097152"              # 2MiB 片
          JOBS: "100"                   # 双端并行拉取
          RANDOM_PICK: "50"             # 全桶随机抽 50 个文件
          CHUNKS_PER_FILE: "10"         # 每文件 10 片
          DEL_MISMATCH: "1"             # 不一致 → 删除目标坏文件,重跑 sync 修复
          MIN_SIZE: "1048576"           # 只探 ≥1MiB 对象
          VERBOSE: "1"                  # 逐片打进度(实时日志可见)
          PROBE_SEED: "${{ github.run_id }}"  # 每个 run 换一批抽样文件(固定种子会让多轮只验同 50 个)
          FETCH_MODE: ${{ inputs.fetch_mode }}  # rclone|aria2|curl, 见 bin/chunk-probe.sh 的阶段2
        run: |
          . /tmp/paths.src
          set -o pipefail
          chmod +x bin/chunk-probe.sh
          export RCLONE_CONFIG PYTHON
          # chunk-probe 的 aria2/curl 模式靠 rc operations/publiclink 双侧签直链。
          # cloud189 的 Fs.PublicLink 自 cdn.26(b13b58afc)起可用,目标端能签出直链。
          if bin/chunk-probe.sh "$SRC" "$DST" 2>&1 | sed -uE 's/(session[_-]?[Kk]ey=)[^,"[:space:]]+/\1***/g' | tee sample.log; then
            echo "random sample content PASSED" | tee -a sample.log
            rc=0
          else
            rc=$?
            echo "random sample content FAILED(chunk-probe exit=$rc)" | tee -a sample.log
          fi
          echo "--- 探针汇总(探针尾部 summary 行) ---" | tee -a sample.log
          grep -a "probe done\|lsjson 失败\|阶段" sample.log 2>/dev/null | tail -20 | tee -a sample.log || true
          echo "WORKDIR artifact 路径: $WORKDIR" | tee -a sample.log
          exit $rc

      - name: Upload logs (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss2cloud189-diag-${{ github.run_number }}
          path: |
            copy.log
            check.log
            sample.log
            /tmp/resmon.log
            /tmp/skipdiff.out
            /tmp/expected-skip.txt
            /tmp/probe-artifact/diag/
          if-no-files-found: ignore

      - name: Upload probe chunks (大体积分片本体,取证才拉)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss2cloud189-chunks-${{ github.run_number }}
          path: |
            /tmp/probe-artifact/chunks/
          retention-days: 3
          if-no-files-found: ignore

      - name: Remove fetched config
        if: always()
        run: |
          if [ -f "$RCLONE_CONFIG" ]; then shred -u "$RCLONE_CONFIG" || rm -f "$RCLONE_CONFIG"; fi
