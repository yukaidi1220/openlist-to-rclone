# OSS → 联通网盘(wopan) 迁移执行器(公开仓运行,凭据经私有仓 conf 注入)
#
# 目标路径:s3-bak/<源桶名>/<原 key>,桶内结构原封保留。
# 源端:列表/元数据走签名 API,内容经 CDN 预签名下载(download_host)。
# 目标端:wopan token 直传。
#
# wopan 特有限制(详见 rclone wopan 文档):
#   - 上传后 mtime 不可改 → copy 必须带 --size-only,否则每轮都全量重传
#   - 不支持 0 字节文件(遇到会报错跳过,不影响其他文件)
#   - 文件名 ≤100 字符,部分特殊符号/4 字节字符不可用
#   - ≥8MiB 文件 MD5 有分钟级沉降窗口(抽样的 cat|md5sum 是真实内容,不受影响)
#
# 断点语义:copy 粒度为整文件,重跑自动跳过已存在(--size-only)的文件。

name: OSS2wopan migrate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        required: true
        default: "dry-run"
        options:
          - dry-run
          - copy
          - sync
          - verify
      path:
        description: "迁移路径前缀(留空=整桶,相对桶根)"
        required: false
        default: ""

concurrency:
  group: oss2wopan
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RCLONE_CONFIG: /tmp/oss2wopan.conf
    steps:
      - name: Fetch oss2wopan.conf from private repo
        env:
          RCLONE_PAT: ${{ secrets.RCLONE_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          umask 077
          for i in {1..3}; do
            if curl -fsSL --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 5 \
              -H "Authorization: token $RCLONE_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/oss2wopan.conf" \
              -o "$RCLONE_CONFIG" \
              && curl -fsSL --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 5 \
              -H "Authorization: token $RCLONE_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/oss2wopan.dstbase" \
              -o /tmp/dstbase; then
              echo "配置获取成功"
              break
            fi
            echo "获取失败,重试 $i/3..."
            sleep $((i * 5))
          done
          [ -f "$RCLONE_CONFIG" ] || { echo "::error::无法获取 oss2wopan.conf"; exit 1; }
          [ -f /tmp/dstbase ] || { echo "::error::无法获取 oss2wopan.dstbase"; exit 1; }

      - name: Parse config & set paths
        env:
          PATH_PREFIX: ${{ inputs.path }}
        run: |
          SRC_BUCKET=$(grep '^bucket' "$RCLONE_CONFIG" | tr -s ' ' | cut -d' ' -f3 | head -1)
          [ -n "$SRC_BUCKET" ] || { echo "::error::conf 缺少 src.bucket"; exit 1; }
          DST_BASE=$(cat /tmp/dstbase)
          PARAM_PREFIX="$PATH_PREFIX"
          if [ -n "$PARAM_PREFIX" ]; then
            SRC="src:$SRC_BUCKET/$PARAM_PREFIX"
            DST="wopan:$DST_BASE/$PARAM_PREFIX"
          else
            SRC="src:$SRC_BUCKET"
            DST="wopan:$DST_BASE"
          fi
          # 单行 echo,不涉及 printf 多行:直接用 bash 的 declare -p 输出可 source 行
          { echo "set -a"; echo "SRC=$SRC"; echo "DST=$DST"; echo "set +a"; } > /tmp/paths.src
          echo "== paths.src =="
          cat /tmp/paths.src
          echo "== SRC token check =="
          grep -c '^SRC=src' /tmp/paths.src

      # ---- WARP(最先执行:最快暴露 WARP 问题)----
      # 当前模式:WARP v6-only 隧道。
      # 实测结论(2026-08-30 run 33325656692):WARP v4 出口(104.28.x)到 wopan 控制面超时(被屏蔽/不通),
      # 但 WARP v6 出口(2a09:bac1.x)可达(此前 curl -6 panservice HTTP 200)。
      # 因此:仅 v6 进隧道(v6 地址+v6 默认路由+allowed-ips ::/0),v4 完全保持原路直连。
      # rclone(Go)对有 AAAA 的域名天然偏好 v6 → wopan 流量走 WARP v6;无 AAAA 的走 v4 直连。
      # tcpdump proof test 步骤负责用铁证验证上传实际走哪个族。
      # 生死细节(勿删):wireguard endpoint(v4)在未劫持的 v4 默认路由上,天然直连,无循环风险。
      # 钉扎清单(仅切回 v4 劫持/双栈模式时启用;当前 v6-only 未劫持 v4,无需钉扎):
      #   私有/保留:10/8 172.16/12 192.168/16 100.64/10 127/8
      #   微软/Azure:20/8 13/8 52/8 168.0.0.0/8(用户指定 168 段视为微软放行直连)
      #   GitHub:140/8 185.199/16
      #   + wireguard endpoint /32 直连、Azure 平台服务 168.63.129.16
      - name: Setup Cloudflare WARP (v6-only tunnel, for wopan upload)
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'sync' }}
        env:
          RCLONE_PAT: ${{ secrets.RCLONE_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools resolvconf
          curl -fsSL --retry 3 --retry-delay 5 \
            -o /tmp/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.31/wgcf_2.2.31_linux_amd64
          chmod +x /tmp/wgcf && sudo mv /tmp/wgcf /usr/local/bin/wgcf
          curl -fsSL --retry 3 --retry-delay 5 \
            -H "Authorization: token $RCLONE_PAT" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/wgcf/wgcf-account.toml" \
            -o wgcf-account.toml || { echo "::error::拉取 wgcf-account.toml 失败"; exit 1; }
          wgcf generate
          echo "===== wgcf-profile.conf ====="
          cat wgcf-profile.conf
          PRIVATE_KEY=$(grep 'PrivateKey' wgcf-profile.conf | awk '{print $NF}')
          # profile 的 Address 是单行逗号分隔(如 "172.16.0.2/32, 2606:.../128"),必须按逗号拆
          ADDR_V6=$(grep -i '^Address' wgcf-profile.conf | sed 's/^[Aa]ddress[ \t]*=[ \t]*//' | tr ',' '\n' | tr -d ' ' | grep ':' | head -1)
          PEER_KEY=$(grep 'PublicKey' wgcf-profile.conf | awk '{print $NF}')
          ENDPOINT=$(grep 'Endpoint' wgcf-profile.conf | awk '{print $NF}')
          if [ -z "$ADDR_V6" ]; then echo "::error::WARP 未分配 IPv6 地址"; exit 1; fi
          echo "ADDR_V6=$ADDR_V6"
          DEV=$(ip route show default | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}' | head -1)
          GW=$(ip route show default | awk '{for(i=1;i<=NF;i++) if($i=="via") print $(i+1)}' | head -1)
          echo "DEV=$DEV GW=$GW"
          sudo ip link add wgcf type wireguard
          echo "$PRIVATE_KEY" | sudo wg set wgcf private-key /dev/stdin
          # v6 侧:私有 ULA + GitHub 段走原始网卡,不进 WARP
          for NET6 in fc00::/7 2a01::/16 2620::/16; do
            sudo ip -6 route add "$NET6" dev "$DEV" 2>/dev/null || true
          done
          # allowed-ips 仅 v6:v4 流量与无 WARP 时完全一致
          sudo wg set wgcf peer "$PEER_KEY" endpoint "$ENDPOINT" allowed-ips "::/0"
          sudo ip link set mtu 1280 up dev wgcf
          sudo ip addr add "$ADDR_V6" dev wgcf
          sudo ip -6 route replace ::/0 dev wgcf
          # MSS 钳制:WARP MTU=1280,防 PMTUD 黑洞
          sudo ip6tables -t mangle -A OUTPUT -o wgcf -p tcp \
            --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || \
          sudo iptables -t mangle -A OUTPUT -o wgcf -p tcp \
            --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
          echo "===== IP 出口探测 ====="
          echo "--- cloudflare-cn trace (v4,应保持 runner 原生出口) ---"
          curl -4 -sS --max-time 10 "https://www.cloudflare-cn.com/cdn-cgi/trace" | grep -E '^(ip|warp|colo|loc)=' || echo "(v4 不通)"
          echo "--- dash.cloudflare trace (v6,应为 WARP 出口) ---"
          curl -6 -sS --max-time 10 "https://dash.cloudflare.com/cdn-cgi/trace" | grep -E '^(ip|warp|colo|loc)=' || echo "(v6 不通)"
          echo ">>> [硬校验] v6 出口必须是 WARP(dash trace warp=on)"
          w6=$(curl -6 -sS --max-time 10 "https://dash.cloudflare.com/cdn-cgi/trace" | grep '^warp=' || true)
          echo "v6 trace: $w6"
          [ "$w6" = "warp=on" ] || { echo "::error::WARP v6 未接管,按要求终止"; exit 1; }
          echo ">>> [硬校验] wopan 控制面可达(panservice.mail.wo.cn via WARP v6)"
          code=$(curl -6 -sS --max-time 15 -o /dev/null -w "%{http_code}" https://panservice.mail.wo.cn) \
            || { echo "::error::wopan 控制面经 WARP v6 不通,按要求终止"; exit 1; }
          echo "wopan v6 HTTP $code"

      - name: "Install rclone (custom build: s3 download_host + wopan)"
        run: |
          URL="https://github.com/yukaidi1220/rclone/releases/latest/download/rclone-cdn-linux-amd64"
          curl -fsSL --connect-timeout 15 --max-time 300 --retry 3 --retry-delay 5 \
            -o /tmp/rclone "$URL" || { echo "::error::无法下载 rclone release"; exit 1; }
          chmod +x /tmp/rclone
          sudo mv /tmp/rclone /usr/local/bin/rclone
          rclone version | head -2

      # ---- 预检 ----
      - name: Preflight - source bucket scoped
        if: inputs.mode != 'cleanup'
        run: |
          . /tmp/paths.src
          rclone size "$SRC" --json --no-check-certificate > /tmp/size.json
          jq -r '"objects=\(.count // .files) bytes=\(.bytes)"' /tmp/size.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preflight - wopan connectivity
        if: inputs.mode != 'cleanup'
        run: |
          rclone lsd wopan: > /dev/null 2>&1 || rclone lsf wopan: --max-depth 1 > /dev/null
          echo "wopan OK"

      - name: Preflight - CDN presigned GET probe
        if: ${{ inputs.mode != 'cleanup' }}
        run: |
          . /tmp/paths.src
          set -o pipefail
          # 注意:此构建裸数字 size 非 1 字节语义,必须写 1b,否则小文件全被过滤
          # --no-mimetype --no-modtime(注意拼写无连字符):ListV2 元数据够用,避免每对象 2 次经 CDN 的 Head
          probe=$(rclone lsjson "$SRC" -R --files-only --min-size 1b --max-size 8Mi \
                    --no-mimetype --no-modtime \
                    | jq -r 'sort_by(.Size) | .[0].Path // empty')
          if [ -z "$probe" ]; then
            echo "::warning::范围内没有小文件,跳过 CDN 探测"
            exit 0
          fi
          expect=$(rclone lsjson "$SRC/$probe" --no-mimetype --no-modtime | jq -r '.[0].Size')
          echo "probing: $probe ($expect bytes)"
          got=$(rclone cat "$SRC/$probe" 2>/tmp/cat.err | wc -c)
          if [ -s /tmp/cat.err ]; then echo "--- cat stderr ---"; cat /tmp/cat.err; fi
          echo "got: $got bytes"
          if [ "$got" -ne "$expect" ]; then
            echo "首次不符,视为 IP 脏瞬态失败,等待 20s(404 边缘缓存 TTL)后重试一次"
            sleep 20
            got=$(rclone cat "$SRC/$probe" 2>/tmp/cat.err | wc -c)
            if [ -s /tmp/cat.err ]; then echo "--- cat stderr (retry) ---"; cat /tmp/cat.err; fi
            echo "got(retry): $got bytes"
          fi
          [ "$got" -eq "$expect" ] || { echo "::error::CDN 下载字节数不符"; exit 1; }
          echo "CDN presigned GET OK"

      # ---- 上传协议族验证(tcpdump 铁证):双小文件上传全程抓包,统计 v6/v4 ----
      - name: V6 proof test - tcpdump during small upload
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'sync' }}
        run: |
          . /tmp/paths.src
          set -o pipefail
          # 挑 2 个 256KiB~16MiB 的文件(太小看不出流量特征);区间没有再退回最小文件
          mapfile -t FILES < <(rclone lsjson "$SRC" -R --files-only --min-size 256Ki --max-size 16Mi \
            --no-mimetype --no-modtime | jq -r 'sort_by(.Size) | .[0:2][] | .Path')
          if [ ${#FILES[@]} -lt 2 ]; then
            mapfile -t FILES < <(rclone lsjson "$SRC" -R --files-only --min-size 1b --max-size 8Mi \
              --no-mimetype --no-modtime | jq -r 'sort_by(.Size) | .[0:2][] | .Path')
          fi
          echo "样本文件: ${FILES[*]}"
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::找不到小文件样本"; exit 1; }
          # 消除 libibverbs 枚举接口的无害警告噪音
          sudo mkdir -p /etc/libibverbs.d
          # 开始抓包(any 接口,全流量,-s 0 全包长,保留 TLS Client Hello 与负载)
          sudo rm -f /tmp/v6test.pcap /tmp/pcap.txt
          sudo timeout 300 tcpdump -i any -s 0 -w /tmp/v6test.pcap 'ip6 or ip' & TCPDUMP_PID=$!
          sleep 2
          for f in "${FILES[@]}"; do
            echo ">>> 上传: $f"
            rclone copyto "$SRC/$f" "$DST/_v6test/$(basename "$f")" \
              --size-only --no-check-certificate --transfers 1 --checkers 4 -v
          done
          sleep 3
          sudo kill -INT "$TCPDUMP_PID" 2>/dev/null || true
          sleep 2
          # 先保存 pcap 到 workspace(供 artifact 上传),再做统计分析
          sudo cp /tmp/v6test.pcap "$GITHUB_WORKSPACE/v6test.pcap"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/v6test.pcap"
          ls -l "$GITHUB_WORKSPACE/v6test.pcap"
          # 统计
          sudo tcpdump -nn -r /tmp/v6test.pcap 2>/dev/null > /tmp/pcap.txt || true
          wc -l /tmp/pcap.txt
          echo "===== 协议族包数 ====="
          v6c=$(grep -c ' IP6 ' /tmp/pcap.txt || true)
          v4c=$(grep ' IP ' /tmp/pcap.txt | grep -vc ' IP6 ' || true)
          echo "IPv6 包数: $v6c"
          echo "IPv4 包数: $v4c"
          echo "===== IPv6 top 对端 ====="
          grep ' IP6 ' /tmp/pcap.txt | awk '{print $3, " -> ", $5}' | sort | uniq -c | sort -rn | head -15 || true
          echo "===== IPv4 top 对端 ====="
          grep ' IP ' /tmp/pcap.txt | grep -v ' IP6 ' | awk '{print $3, " -> ", $5}' | sort | uniq -c | sort -rn | head -15 || true
          # 自动判定:上传流量大头在哪个协议族
          if [ "$v6c" -gt "$v4c" ] && [ "$v6c" -gt 100 ]; then
            echo ">>> 结论:上传流量以 IPv6 为主(走了 WARP v6)"
          elif [ "$v4c" -gt "$v6c" ] && [ "$v4c" -gt 100 ]; then
            echo ">>> 结论:上传流量以 IPv4 为主(没走 v6!上传端点可能无 AAAA 或回退 v4)"
          else
            echo ">>> 结论:流量太少无法判定,请看 top 对端明细"
          fi
          # 清理测试文件(wopan 侧不残留)
          for f in "${FILES[@]}"; do
            rclone deletefile "$DST/_v6test/$(basename "$f")" --no-check-certificate || true
          done
          rclone rmdir "$DST/_v6test" --no-check-certificate 2>/dev/null || true
          echo "清理完成"

      # pcap 原始文件 artifact(下载后即 zip 包,内含 v6test.pcap)
      - name: Upload pcap artifact
        if: ${{ (inputs.mode == 'copy' || inputs.mode == 'sync') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v6test-pcap
          path: v6test.pcap
          if-no-files-found: ignore

      # ---- 复制 ----
      - name: Copy (dry-run)
        if: inputs.mode == 'dry-run'
        run: |
          . /tmp/paths.src
          # dry-run 展示:sync 模式显示 Would delete 清单,copy 模式显示 Would copy;流式 stats 便于观察
          rclone copy "$SRC" "$DST" --dry-run \
            --size-only --no-check-certificate \
            --transfers 4 --checkers 8 \
            --stats 60s -v 2>&1 | tee copy.log
          rclone sync "$SRC" "$DST" --dry-run \
            --size-only --no-check-certificate \
            --transfers 4 --checkers 8 \
            --stats 60s -v 2>&1 | tee -a copy.log

      - name: Copy
        if: inputs.mode == 'copy'
        run: |
          . /tmp/paths.src
          set -o pipefail
          # --size-only: wopan mtime 不可改,必须按大小判增
          # --no-check-certificate: 源 endpoint CNAME 到 aliyuncs,证书不匹配
          # 走向说明:WARP 步骤 v4-only(不拉起 v6),rclone 无 v6 可走,全部流量走 WARP v4
          rclone copy "$SRC" "$DST" \
            --size-only --no-check-certificate \
            --transfers 20 --checkers 10 \
            --retries 5 --low-level-retries 20 \
            --stats 30s -v 2>&1 | tee copy.log

      - name: Sync (镜像目标,会删除目标端多余文件)
        if: inputs.mode == 'sync'
        run: |
          . /tmp/paths.src
          set -o pipefail
          # sync = 源→目标单向镜像:目标前缀下不在源桶的文件会被删除(wopan 默认进回收站)。
          # 仅限 SRC/DST 前缀内,配合 --size-only(wopan mtime 不可改)
          rclone sync "$SRC" "$DST" \
            --size-only --no-check-certificate \
            --transfers 20 --checkers 10 \
            --retries 5 --low-level-retries 20 \
            --stats 30s -v 2>&1 | tee copy.log

      # ---- 校验 ----
      - name: Verify - full one-way check (size, wopan hash 沉降不适用)
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'sync' || inputs.mode == 'verify' }}
        run: |
          . /tmp/paths.src
          set -o pipefail
          rclone check "$SRC" "$DST" --one-way --size-only -v 2>&1 | tee check.log
          echo "full one-way size check PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify - random sample content md5 (双端真实下载)
        if: ${{ inputs.mode == 'copy' || inputs.mode == 'sync' || inputs.mode == 'verify' }}
        run: |
          . /tmp/paths.src
          set -o pipefail
          # 并发容错:源桶可能被其他客户端并发修改(对象瞬时消失/内容变动)。
          # 任一端读取失败(cat 非零)或 stderr 出现 error/notice 时,跳过该样本并警告,
          # 绝不删除目标文件;只有双端都完整读出且 md5 不一致才判为真实损坏。
          rclone lsjson "$SRC" -R --files-only --no-mimetype --no-modtime > files.json
          total=$(jq 'length' files.json)
          echo "total files: $total"
          mapfile -t picks < <(jq -r '.[].Path' files.json | shuf -n 5)
          : > sample.log
          fail=0; skip=0; ok=0
          for p in "${picks[@]}"; do
            size=$(jq -r --arg p "$p" '.[] | select(.Path==$p) | .Size' files.json)
            echo "== sample: $p ($size bytes)" | tee -a sample.log
            src_md5=$(rclone cat "$SRC/$p" --no-check-certificate 2>/tmp/src.err | md5sum | awk '{print $1}') \
              || { echo "   SKIP: 源端读取失败,跳过(不删目标)" | tee -a sample.log; sed -n '1,3p' /tmp/src.err | sed 's/^/   src: /' | tee -a sample.log; skip=$((skip+1)); continue; }
            if [ -s /tmp/src.err ] && grep -qiE 'error|notice|failed|not found' /tmp/src.err; then
              echo "   SKIP: 源端 stderr 异常,跳过(不删目标)" | tee -a sample.log; sed -n '1,3p' /tmp/src.err | sed 's/^/   src: /' | tee -a sample.log; skip=$((skip+1)); continue
            fi
            dst_md5=$(rclone cat "$DST/$p" 2>/tmp/dst.err | md5sum | awk '{print $1}') \
              || { echo "   SKIP: 目标端读取失败,跳过(不删目标)" | tee -a sample.log; sed -n '1,3p' /tmp/dst.err | sed 's/^/   dst: /' | tee -a sample.log; skip=$((skip+1)); continue; }
            if [ -s /tmp/dst.err ] && grep -qiE 'error|notice|failed|not found' /tmp/dst.err; then
              echo "   SKIP: 目标端 stderr 异常,跳过(不删目标)" | tee -a sample.log; sed -n '1,3p' /tmp/dst.err | sed 's/^/   dst: /' | tee -a sample.log; skip=$((skip+1)); continue
            fi
            echo "   src md5: $src_md5" | tee -a sample.log
            echo "   dst md5: $dst_md5" | tee -a sample.log
            if [ "$src_md5" != "$dst_md5" ]; then
              echo "   MISMATCH -> 删除目标坏文件以便重传" | tee -a sample.log
              rclone deletefile "$DST/$p"
              fail=$((fail+1))
            else
              echo "   MATCH" | tee -a sample.log
              ok=$((ok+1))
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::warning::抽样发现 $fail 个不一致的目标文件已删除,重跑 copy 即可修复"
            exit 1
          fi
          if [ "$skip" -ne 0 ]; then
            echo "::warning::抽样有 $skip 个样本因读取失败被跳过(可能是源桶并发修改),未删任何目标文件"
          fi
          if [ "$ok" -eq 0 ] && [ "$skip" -ne 0 ]; then
            echo "::warning::本次抽样没有有效样本,内容校验未真正完成,建议重跑 verify"
          fi
          echo "random sample content-md5 PASSED (ok=$ok skip=$skip)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss2wopan-logs-${{ github.run_number }}
          path: |
            copy.log
            check.log
            sample.log
          if-no-files-found: ignore

      - name: Writeback refreshed wopan token (best-effort)
        if: always()
        env:
          RCLONE_PAT: ${{ secrets.RCLONE_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # wopan refresh_token 是轮换型:执行器刷新后旧值作废,必须把
          # 刷新后的 conf 写回私有仓,否则下次 launcher 用死 token。
          if [ ! -f "$RCLONE_CONFIG" ]; then echo "conf 已清理,跳过"; exit 0; fi
          NEW_TOKEN=$(awk -F' *= *' '/^\[wopan\]/{f=1;next} /^\[/{f=0} f&&$1=="refresh_token"{print $2}' "$RCLONE_CONFIG")
          [ -n "$NEW_TOKEN" ] || { echo "::warning::未解析到 refresh_token"; exit 0; }
          RESP=$(curl -fsS -H "Authorization: token $RCLONE_PAT" \
            "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/oss2wopan.conf") || RESP=""
          OLD_SHA=$(echo "$RESP" | jq -r '.sha // empty')
          # 无变化不回写,避免空 commit
          if [ -n "$OLD_SHA" ]; then
            echo "$RESP" | jq -r '.content' | base64 -d > /tmp/conf.remote 2>/dev/null || true
            if [ -s /tmp/conf.remote ] && diff -q <(sed 's/\r$//' /tmp/conf.remote) <(sed 's/\r$//' "$RCLONE_CONFIG") >/dev/null 2>&1; then
              echo "conf 与私有仓完全一致,跳过回写(不产生空 commit)"
              exit 0
            fi
          fi
          B64=$(base64 -w0 "$RCLONE_CONFIG")
          BODY=$(jq -n --arg msg "chore: wopan token rotate (auto)" --arg b "$B64" --arg s "$OLD_SHA" \
            '{message:$msg,content:$b,branch:"main",sha:$s}')
          if curl -fsS -X PUT -H "Authorization: token $RCLONE_PAT" \
            -H "Accept: application/vnd.github.v3.raw" \
            -d "$BODY" \
            "https://api.github.com/repos/$REPO_OWNER/rclone-action/contents/oss2wopan.conf" > /dev/null; then
            echo "token 已回写私有仓"
          else
            echo "::warning::token 回写失败(RCLONE_PAT 可能无写权限)——下次运行前请重新在 launcher 填入新 refresh_token!"
          fi

      - name: Remove fetched config
        if: always()
        run: |
          if [ -f "$RCLONE_CONFIG" ]; then shred -u "$RCLONE_CONFIG" || rm -f "$RCLONE_CONFIG"; fi
